<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng - Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Card bao bọc Form -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tiêu đề & Text định dạng -->
                        <h2 class="text-center text-primary fw-bold mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới.</p>

                        <form>
                            <!-- Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Họ và tên</label>
                                <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-semibold">Địa chỉ Email</label>
                                <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi cam kết không chia sẻ email của bạn với ai khác.</div>
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label for="passwordInput" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="passwordInput" placeholder="Nhập mật khẩu" required>
                            </div>

                            <!-- Xác nhận mật khẩu -->
                            <div class="mb-3">
                                <label for="confirmPasswordInput" class="form-label fw-semibold">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu" required>
                            </div>

                            <!-- Giới tính (Radio buttons) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genderOptions" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genderOptions" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genderOptions" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- Sở thích (Checkboxes) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                                    <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                            </div>

                            <!-- Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="countrySelect" class="form-label fw-semibold">Quốc gia</label>
                                <select class="form-select" id="countrySelect" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ (United States)</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                </select>
                            </div>

                            <!-- Nút Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Ký Ngay</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JavaScript Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
